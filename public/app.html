<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width"/>
  <title>Len Den</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236359e0'/%3E%3Ctext x='16' y='22' font-size='16' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial'%3ELD%3C/text%3E%3C/svg%3E"/>
  <link rel="stylesheet" href="/css/app.css"/>
</head>
<body>
  <div class="app" id="appRoot">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">LD</div>
        <div>
          <div class="brand-name" id="brandBiz">Len Den</div>
          <div class="brand-sub" id="brandSub">My Business</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <div class="nav-section">Menu</div>
        <button class="nav-item active" data-view="dashboard"><span class="ico">📊</span> Dashboard</button>
        <button class="nav-item" data-view="khata"><span class="ico">🧾</span> Transactions</button>
        <button class="nav-item" data-view="parties"><span class="ico">👥</span> Parties</button>
        <button class="nav-item" data-view="items"><span class="ico">📦</span> Inventory</button>
        <button class="nav-item" data-view="reports"><span class="ico">📈</span> Reports</button>
        <div class="nav-section">Manage</div>
        <button class="nav-item" data-view="staff"><span class="ico">🛡️</span> Staff</button>
        <button class="nav-item" data-view="settings"><span class="ico">⚙️</span> Settings</button>
      </nav>
      <div class="sidebar-foot">
        <div class="user-chip" title="Logout" id="userChip">
          <div class="avatar" id="userAvatar">O</div>
          <div>
            <div class="uname" id="userName">Owner</div>
            <div class="urole" id="userPhone"></div>
          </div>
          <button class="btn btn-ghost btn-sm logout" id="logoutBtn" title="Logout">⏻</button>
        </div>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div>
          <div class="tb-title" id="tbTitle">Dashboard</div>
          <div style="font-size:12px;color:var(--text-tertiary);" id="tbDate"></div>
        </div>
        <div class="search-box" id="globalSearchWrap">
          <span class="sico">🔍</span>
          <input class="input" id="globalSearch" placeholder="Search..."/>
        </div>
      </div>
      <div id="view" class="page"></div>
    </div>
  </div>
  <div id="modals"></div>
  <div class="toasts" id="toasts"></div>
  <script src="/js/app.js"></script>
</body>
</html>
