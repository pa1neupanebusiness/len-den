<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width"/>
  <title>Len Den</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236359e0'/%3E%3Ctext x='16' y='22' font-size='16' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial'%3ELD%3C/text%3E%3C/svg%3E"/>
  <link rel="stylesheet" href="/css/app.css"/>
</head>
<body>
  <div class="app" id="appRoot">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">LD</div>
        <div>
          <div class="brand-name" id="brandBiz">Len Den</div>
          <div class="brand-sub" id="brandSub">My Business</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <div class="nav-section">Business</div>
        <button class="nav-item active" data-view="dashboard"><span class="ico">📊</span><span class="txt"> Dashboard</span></button>
        <button class="nav-item" data-view="parties"><span class="ico">👥</span><span class="txt"> Parties</span></button>
        <button class="nav-item" data-view="items"><span class="ico">📦</span><span class="txt"> Inventory</span></button>
        <button class="nav-item nav-parent" data-view="sales" data-expands="sales"><span class="ico">🧾</span><span class="txt"> Sales</span><span class="caret">▾</span></button>
        <div class="nav-sub" id="sub-sales">
          <button class="nav-item" data-view="sales_invoices"><span class="ico">📄</span><span class="txt"> Create Sales Invoice</span></button>
          <button class="nav-item" data-view="payment_in"><span class="ico">💵</span><span class="txt"> Add Payment In</span></button>
          <button class="nav-item" data-view="quotations"><span class="ico">📝</span><span class="txt"> Create New Quotation</span></button>
          <button class="nav-item" data-view="sales_return"><span class="ico">↩️</span><span class="txt"> Create Sales Return</span></button>
        </div>
        <button class="nav-item nav-parent" data-view="purchase" data-expands="purchase"><span class="ico">🛒</span><span class="txt"> Purchase</span><span class="caret">▾</span></button>
        <div class="nav-sub" id="sub-purchase">
          <button class="nav-item" data-view="purchase"><span class="ico">🛒</span><span class="txt"> Purchase</span></button>
          <button class="nav-item" data-view="payment_out"><span class="ico">💳</span><span class="txt"> Payment Out</span></button>
          <button class="nav-item" data-view="purchase_return"><span class="ico">↪️</span><span class="txt"> Purchase Return</span></button>
        </div>
        <button class="nav-item" data-view="expense"><span class="ico">💸</span><span class="txt"> Expense</span></button>
        <button class="nav-item" data-view="other_income"><span class="ico">💰</span><span class="txt"> Other Income</span></button>
        <button class="nav-item" data-view="accounts"><span class="ico">🏦</span><span class="txt"> Manage Accounts</span></button>
        <div class="nav-section">Management</div>
        <button class="nav-item nav-parent" data-view="reports" data-expands="reports"><span class="ico">📈</span><span class="txt"> Reports</span><span class="caret">▾</span></button>
        <div class="nav-sub" id="sub-reports">
          <button class="nav-item" data-view="reports"><span class="ico">🗂️</span><span class="txt"> Browse Reports</span></button>
          <button class="nav-item" data-view="report_cat_transactions"><span class="ico">🧾</span><span class="txt"> Transactions</span></button>
          <button class="nav-item" data-view="report_cat_parties"><span class="ico">👥</span><span class="txt"> Parties</span></button>
          <button class="nav-item" data-view="report_cat_inventory"><span class="ico">📦</span><span class="txt"> Inventory</span></button>
          <button class="nav-item" data-view="report_cat_income"><span class="ico">💰</span><span class="txt"> Income Expense</span></button>
          <button class="nav-item" data-view="report_cat_status"><span class="ico">🏢</span><span class="txt"> Business Status</span></button>
        </div>
        <button class="nav-item" data-view="staff"><span class="ico">🛡️</span><span class="txt"> Manage Staffs</span></button>
        <button class="nav-item nav-parent" data-view="import_parties" data-expands="import"><span class="ico">📥</span><span class="txt"> Import Data</span><span class="caret">▾</span></button>
        <div class="nav-sub" id="sub-import">
          <button class="nav-item" data-view="import_parties"><span class="ico">👥</span><span class="txt"> Import Parties</span></button>
          <button class="nav-item" data-view="import_items"><span class="ico">📦</span><span class="txt"> Import Items</span></button>
        </div>
        <div class="nav-section">Business Tools</div>
        <button class="nav-item nav-parent" data-view="business_cards" data-expands="tools"><span class="ico">🛠️</span><span class="txt"> Business Tools</span><span class="caret">▾</span></button>
        <div class="nav-sub" id="sub-tools">
          <button class="nav-item" data-view="business_cards"><span class="ico">💼</span><span class="txt"> Business Cards</span></button>
          <button class="nav-item" data-view="greeting_cards"><span class="ico">🎉</span><span class="txt"> Greeting Cards</span></button>
          <button class="nav-item" data-view="reminders"><span class="ico">⏰</span><span class="txt"> Reminders</span></button>
          <button class="nav-item" data-view="bill_gallery"><span class="ico">🖼️</span><span class="txt"> Bill Gallery</span></button>
          <button class="nav-item" data-view="barcode"><span class="ico">🏷️</span><span class="txt"> Barcode Generator</span></button>
        </div>
        <button class="nav-item" data-view="refer"><span class="ico">🎁</span><span class="txt"> Refer &amp; Win</span></button>
        <div class="nav-section">Others</div>
        <button class="nav-item" data-view="help"><span class="ico">🆘</span><span class="txt"> Help &amp; Support</span></button>
        <button class="nav-item" data-view="tutorials"><span class="ico">🎓</span><span class="txt"> Tutorials</span></button>
        <div class="nav-section">Settings</div>
        <button class="nav-item" data-view="settings"><span class="ico">⚙️</span><span class="txt"> Settings</span></button>
      </nav>
      <div class="sidebar-foot">
        <div class="user-chip" title="Logout" id="userChip">
          <div class="avatar" id="userAvatar">O</div>
          <div>
            <div class="uname" id="userName">Owner</div>
            <div class="urole" id="userPhone"></div>
          </div>
          <button class="btn btn-ghost btn-sm logout" id="logoutBtn" title="Logout">⏻</button>
        </div>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <button class="icon-btn hamburger" id="sideToggle" title="Toggle menu" onclick="toggleSidebar()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div>
          <div class="tb-title" id="tbTitle">Dashboard</div>
          <div style="font-size:12px;color:var(--text-tertiary);" id="tbDate"></div>
        </div>
      </div>
      <div id="view" class="page"></div>
    </div>
  </div>
  <div id="modals"></div>
  <div class="toasts" id="toasts"></div>
  <script src="/js/qrcode.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
